[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-m31-quant-eval"
version = "0.2.0"
description = "Cached server-side quantization fidelity evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["pyarrow>=15", "tomli>=2; python_version < '3.11'"]

[project.scripts]
m31-eval = "m31eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
